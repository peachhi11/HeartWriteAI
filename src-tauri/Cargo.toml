[package]
name = "heartwriteai"
version = "0.1.0"
description = "Local-first romance character, persona, lorebook, image, and chat studio."
authors = ["peachhi11"]
license = "MIT"
repository = "https://github.com/peachhi11/HeartWriteAI"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "heartwriteai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.6.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-core = "2.0.0-beta.0"
tauri-plugin-store = "2.4.3"
png = "0.17"
zip = { version = "2.4.2", features = ["deflate"] }
base64 = "0.22"
image = "0.25"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
tauri-plugin-dialog = "2.3.0"
tauri-plugin-fs = "2.5.1"
